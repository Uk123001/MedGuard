apiVersion: v1
kind: Secret
metadata: {name: medguard-secret}
type: Opaque
stringData:
  REVIEWER_CODE: demo-code-123
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: resolver, labels: {app: resolver}}
spec:
  replicas: 2
  selector: {matchLabels: {app: resolver}}
  template:
    metadata: {labels: {app: resolver}}
    spec:
      containers:
      - name: resolver
        image: medguard-resolver:1
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8080}]
        readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 3, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 10, periodSeconds: 10}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 250m, memory: 192Mi}
---
apiVersion: v1
kind: Service
metadata: {name: resolver}
spec:
  type: ClusterIP
  selector: {app: resolver}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: lists, labels: {app: lists}}
spec:
  replicas: 2
  selector: {matchLabels: {app: lists}}
  template:
    metadata: {labels: {app: lists}}
    spec:
      containers:
      - name: lists
        image: medguard-lists:1
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8080}]
        env:
        - name: REVIEWER_CODE
          valueFrom: {secretKeyRef: {name: medguard-secret, key: REVIEWER_CODE}}
        readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 3, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 10, periodSeconds: 10}
        resources:
          requests: {cpu: 50m, memory: 96Mi}
          limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: lists}
spec:
  type: ClusterIP
  selector: {app: lists}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, labels: {app: frontend}}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
      - name: frontend
        image: medguard-frontend:1
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 80}]
        readinessProbe: {httpGet: {path: /health, port: 80}, initialDelaySeconds: 3, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /health, port: 80}, initialDelaySeconds: 10, periodSeconds: 10}
        resources:
          requests: {cpu: 25m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: frontend}
spec:
  type: NodePort
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]
