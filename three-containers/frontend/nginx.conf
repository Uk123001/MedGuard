server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location = /health { default_type text/plain; return 200 'ok'; }
    location /resolve   { proxy_pass http://resolver:8080; }
    location /lists     { proxy_pass http://lists:8080; }
    location /          { try_files $uri /index.html; }
}
